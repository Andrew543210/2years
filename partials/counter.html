<!-- counter.html (partial) — вставляється як <section> у сторінку -->
<section class="counter" aria-label="Лічильник часу — дні, години, хвилини">
  <div class="counter__grid">
    <div class="counter__cell" data-key="days">
      <div class="counter__value" aria-live="polite" aria-atomic="true">00</div>
      <div class="counter__label">Дні</div>
    </div>

    <div class="counter__cell" data-key="hours">
      <div class="counter__value" aria-live="polite" aria-atomic="true">00</div>
      <div class="counter__label">Години</div>
    </div>

    <div class="counter__cell" data-key="minutes">
      <div class="counter__value" aria-live="polite" aria-atomic="true">00</div>
      <div class="counter__label">Хвилини</div>
    </div>

    <div class="counter__cell" data-key="seconds">
      <div class="counter__value" aria-live="polite" aria-atomic="true">00</div>
      <div class="counter__label">Секунди</div>
    </div>

    <div class="counter__cell counter__cell--joy" data-key="joy">
      <div class="counter__value">
        <span class="counter__infty" aria-hidden="true">∞</span>
      </div>
      <div class="counter__label">Щастя</div>
      <span class="visually-hidden">Нескінченне щастя</span>
    </div>
  </div>

  <style>
    /* Змінні: налаштуй тут кольори та поведінку */
   :root{
  --accent: #1F2937; /* темний для кращого контрасту на світлому фоні */
  --muted: rgba(31,41,55,0.7);
  --bg: rgba(255,245,238,0.6); /* дуже світлий персиковий фон */
  --glass-border: rgba(31,41,55,0.06);
  --cell-bg: rgba(255,255,255,0.85); /* світлі клітинки для чистого вигляду */
  --radius: 12px;
  --gap: 1rem;
  --cell-radius: 10px;
  --infty-anim-duration: 4s;
  --font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
}

    /* Базова стилізація контейнера (partial має виглядати самодостатньо) */
    .counter{
      width:100%;
      display:flex;
      justify-content:center;
      padding: clamp(1rem, 2.5vw, 2.5rem) 1rem;
      box-sizing:border-box;
      background: var(--bg);
      border-radius: var(--radius);
    }

    .counter__grid{
      width:100%;
      max-width:900px;
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap: var(--gap);
      align-items:stretch;
    }

    /* Усі клітинки використовують однаковий фон */
    .counter__cell{
      background: var(--cell-bg);
      border: 1px solid var(--glass-border);
      padding: clamp(.85rem, 1.6vw, 1.25rem);
      border-radius: var(--cell-radius);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:96px;
      color:var(--accent);
      text-align:center;
      backdrop-filter: blur(6px);
      position:relative;
      overflow:hidden;
    }

    /* Забезпечуємо, щоб joy мав той самий фон */
    .counter__cell--joy{
      background: var(--cell-bg);
    }

    /* Стабільний контейнер для значень (щоб уникнути "стрибань") */
    .counter__value{
      font-weight:700;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      line-height:1;
      letter-spacing:-0.02em;
      color:var(--accent);
      display:flex;
      align-items:center;
      justify-content:center;
      min-width: 3ch;
      min-height: 1.2em;
      will-change: transform, opacity;
      font-variant-numeric: tabular-nums;
    }

    .counter__label{
      margin-top:.35rem;
      color:var(--muted);
      font-size: clamp(.78rem, 1.6vw, .95rem);
      font-weight:600;
      text-transform:none;
    }

    /* Анімація появи при зміні значення */
    @keyframes pop {
      0%{ transform: translateY(6px) scale(.96); opacity:0 }
      60%{ transform: translateY(-6px) scale(1.06); opacity:1 }
      100%{ transform: translateY(0) scale(1) }
    }

    .counter__value.is-new{
      animation: pop .55s cubic-bezier(.2,.9,.3,1) both;
    }

    /* Нескінченність: зафіксований центр обертання, плавна лінійна анімація */
    .counter__infty{
      font-size: clamp(1.3rem, 3.6vw, 2.6rem);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      transform-origin: 50% 50%;
      backface-visibility: hidden;
      will-change: transform;
      animation: rotate-infty var(--infty-anim-duration) linear infinite;
      transform: translateZ(0); /* GPU acceleration */
    }

    @keyframes rotate-infty{
      from{ transform: rotate(0deg) }
      to{ transform: rotate(360deg) }
    }

    /* Прихований текст для скрінрідерів */
    .visually-hidden{
      position: absolute !important;
      height: 1px; width: 1px;
      overflow: hidden;
      clip: rect(1px, 1px, 1px, 1px);
      white-space: nowrap;
      border: 0; padding: 0; margin: -1px;
    }

    /* Повага до налаштувань користувача щодо анімацій */
    @media (prefers-reduced-motion: reduce){
      .counter__infty,
      .counter__value.is-new {
        animation: none !important;
        transition: none !important;
      }
    }

    /* Адаптивність: на вузьких екранах 2 колонки */
    @media (max-width:900px){
      .counter__grid{ grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width:420px){
      .counter__value{ font-size: clamp(1.2rem, 6.5vw, 1.6rem); }
      .counter__label{ font-size: .8rem }
    }
  </style>

  <script src="partials/counter.js"></script>
</section>
