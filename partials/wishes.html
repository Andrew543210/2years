<!-- wishes.html (partial) — інтерактивний календар побажань -->
<section class="wishes" aria-label="Наші побажання">
  <div class="wishes__container">
    <header class="wishes__header">
      <h2 class="wishes__title">Ми обов'язково... ✨</h2>
    </header>

    <div class="wishes__calendar">
      <!-- Ячейки генеруються через JS -->
    </div>

    <div class="wishes__message" aria-live="polite">
      <!-- Текст побажання -->
    </div>
  </div>

  <style>
    :root {
      --wishes-primary: #dfa2c1;
      --wishes-secondary: #f5c2d0;
      --wishes-bg: linear-gradient(135deg, #fef5f8 0%, #fdeef3 50%, #fce7ee 100%);
      --wishes-card-bg: rgba(255, 255, 255, 0.9);
      --wishes-shadow: 0 4px 15px rgba(223, 162, 193, 0.2);
      --wishes-shadow-hover: 0 8px 25px rgba(223, 162, 193, 0.35);
      --wishes-text: #831843;
      --wishes-border: rgba(223, 162, 193, 0.25);
    }

    .wishes {
      width: 100%;
      background: var(--wishes-bg);
      padding: clamp(2.5rem, 5vw, 5rem) clamp(1rem, 3vw, 2rem);
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      min-height: 100vh;
      display: flex;
      align-items: center;
    }

    /* Декоративні елементи */
    .wishes::before,
    .wishes::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      opacity: 0.06;
      pointer-events: none;
    }

    .wishes::before {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--wishes-primary) 0%, transparent 70%);
      top: -150px;
      right: -100px;
      animation: floatSlow 12s ease-in-out infinite;
    }

    .wishes::after {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, var(--wishes-secondary) 0%, transparent 70%);
      bottom: -100px;
      left: -80px;
      animation: floatSlow 15s ease-in-out infinite reverse;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.08); }
    }

    .wishes__container {
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      width: 100%;
    }

    /* Header */
    .wishes__header {
      text-align: center;
      margin-bottom: clamp(2.5rem, 5vw, 4rem);
    }

    .wishes__title {
      font-size: clamp(1.85rem, 4.5vw, 3rem);
      font-weight: 700;
      color: var(--wishes-text);
      margin: 0;
      line-height: 1.3;
      text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.6);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      opacity: 0;
      animation: fadeInTitle 1.2s ease forwards;
    }

    @keyframes fadeInTitle {
      from { 
        opacity: 0;
        transform: translateY(-25px);
      }
      to { 
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Calendar Grid */
    .wishes__calendar {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: clamp(1rem, 2vw, 1.5rem);
      margin-bottom: clamp(2rem, 4vw, 3rem);
      padding: 0;
    }

    .wishes__cell {
      aspect-ratio: 1;
      background: var(--wishes-card-bg);
      border: 2px solid var(--wishes-border);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: var(--wishes-shadow);
      font-size: clamp(1.75rem, 3vw, 2.5rem);
      font-weight: 700;
      color: var(--wishes-primary);
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: fadeInCell 0.5s ease forwards;
    }

    .wishes__cell::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, 
        rgba(223, 162, 193, 0.1) 0%, 
        rgba(245, 194, 208, 0.15) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .wishes__cell:hover {
      transform: translateY(-8px) scale(1.05);
      box-shadow: var(--wishes-shadow-hover);
      border-color: var(--wishes-primary);
    }

    .wishes__cell:hover::before {
      opacity: 1;
    }

    .wishes__cell:active {
      transform: translateY(-4px) scale(1.02);
    }

    .wishes__cell.is-revealed {
      background: linear-gradient(135deg, var(--wishes-primary) 0%, var(--wishes-secondary) 100%);
      color: white;
      border-color: var(--wishes-primary);
      cursor: default;
    }

    .wishes__cell.is-revealed::before {
      opacity: 0;
    }

    .wishes__cell.is-revealed:hover {
      transform: translateY(-4px) scale(1.02);
    }

    /* Анімація появи ячейок з затримкою */
    @keyframes fadeInCell {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Затримки для кожної ячейки */
    .wishes__cell:nth-child(1) { animation-delay: 0.03s; }
    .wishes__cell:nth-child(2) { animation-delay: 0.06s; }
    .wishes__cell:nth-child(3) { animation-delay: 0.09s; }
    .wishes__cell:nth-child(4) { animation-delay: 0.12s; }
    .wishes__cell:nth-child(5) { animation-delay: 0.15s; }
    .wishes__cell:nth-child(6) { animation-delay: 0.18s; }
    .wishes__cell:nth-child(7) { animation-delay: 0.21s; }
    .wishes__cell:nth-child(8) { animation-delay: 0.24s; }
    .wishes__cell:nth-child(9) { animation-delay: 0.27s; }
    .wishes__cell:nth-child(10) { animation-delay: 0.3s; }
    .wishes__cell:nth-child(11) { animation-delay: 0.33s; }
    .wishes__cell:nth-child(12) { animation-delay: 0.36s; }
    .wishes__cell:nth-child(13) { animation-delay: 0.39s; }
    .wishes__cell:nth-child(14) { animation-delay: 0.42s; }
    .wishes__cell:nth-child(15) { animation-delay: 0.45s; }
    .wishes__cell:nth-child(16) { animation-delay: 0.48s; }
    .wishes__cell:nth-child(17) { animation-delay: 0.51s; }
    .wishes__cell:nth-child(18) { animation-delay: 0.54s; }
    .wishes__cell:nth-child(19) { animation-delay: 0.57s; }
    .wishes__cell:nth-child(20) { animation-delay: 0.6s; }
    .wishes__cell:nth-child(21) { animation-delay: 0.63s; }
    .wishes__cell:nth-child(22) { animation-delay: 0.66s; }
    .wishes__cell:nth-child(23) { animation-delay: 0.69s; }
    .wishes__cell:nth-child(24) { animation-delay: 0.72s; }

    /* Message Area */
    .wishes__message {
      min-height: 120px;
      background: var(--wishes-card-bg);
      border: 2px solid var(--wishes-border);
      border-radius: 24px;
      padding: clamp(1.5rem, 3vw, 2.5rem);
      box-shadow: var(--wishes-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      line-height: 1.7;
      color: var(--wishes-text);
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .wishes__message.is-visible {
      opacity: 1;
      animation: fadeInMessage 0.6s ease forwards;
    }

    @keyframes fadeInMessage {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .wishes__message-text {
      max-width: 700px;
      position: relative;
      padding: 0 1rem;
    }

    .wishes__message-text::before,
    .wishes__message-text::after {
      content: '💕';
      position: absolute;
      font-size: 1.5rem;
      opacity: 0.4;
    }

    .wishes__message-text::before {
      left: -10px;
      top: -10px;
    }

    .wishes__message-text::after {
      right: -10px;
      bottom: -10px;
    }

    /* Responsive для планшетів */
    @media (max-width: 900px) {
      .wishes {
        padding: clamp(2rem, 4vw, 3rem) clamp(0.75rem, 2vw, 1.5rem);
      }

      .wishes__calendar {
        grid-template-columns: repeat(4, 1fr);
        gap: clamp(0.75rem, 1.5vw, 1.2rem);
      }

      .wishes__message {
        min-height: 100px;
        padding: clamp(1.2rem, 2.5vw, 2rem);
      }
    }

    /* Responsive для мобільних */
    @media (max-width: 640px) {
      .wishes__calendar {
        grid-template-columns: repeat(3, 1fr);
        gap: clamp(0.6rem, 1.2vw, 1rem);
      }

      .wishes__cell {
        border-radius: 16px;
        font-size: clamp(1.5rem, 2.5vw, 2rem);
      }

      .wishes__message {
        min-height: 90px;
        padding: 1.2rem;
        border-radius: 20px;
      }

      .wishes__message-text::before,
      .wishes__message-text::after {
        font-size: 1.2rem;
      }
    }

    /* Малі екрани */
    @media (max-width: 400px) {
      .wishes__title {
        font-size: 1.6rem;
      }

      .wishes__calendar {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem;
      }

      .wishes__cell {
        border-radius: 14px;
        font-size: 1.4rem;
      }

      .wishes__message {
        min-height: 80px;
        padding: 1rem;
        font-size: 1rem;
      }
    }

    /* Accessibility та motion preferences */
    @media (prefers-reduced-motion: reduce) {
      .wishes__title,
      .wishes::before,
      .wishes::after,
      .wishes__cell,
      .wishes__message {
        animation: none !important;
        transition: none !important;
      }

      .wishes__cell:hover {
        transform: none;
      }
    }

    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      :root {
        --wishes-card-bg: rgba(255, 255, 255, 0.95);
        --wishes-text: #831843;
      }
    }
  </style>

  <script src="partials/wishes.js"></script>
</section>
