<!-- memories.html (partial) — карусель легендарних спогадів -->
<section class="memories" aria-label="Наші перші спогади">
  <div class="memories__container">
    <header class="memories__header">
      <h2 class="memories__title">З чого все починалось ❤️</h2>
    </header>

    <div class="memories__carousel-wrapper">
      <button class="memories__nav memories__nav--prev" aria-label="Попереднє">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <div class="memories__carousel">
        <div class="memories__track">
          <!-- Слайди генеруються через JS -->
        </div>
      </div>

      <button class="memories__nav memories__nav--next" aria-label="Наступне">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <div class="memories__dots" role="tablist" aria-label="Навігація по спогадах">
      <!-- Dots генеруються через JS -->
    </div>
  </div>

  <style>
    :root {
      --memories-primary: #dfa2c1;
      --memories-secondary: #f9a8d4;
      --memories-bg: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 50%, #f9a8d4 100%);
      --memories-card-bg: rgba(255, 255, 255, 0.95);
      --memories-shadow: 0 20px 60px rgba(236, 72, 153, 0.15);
      --memories-shadow-hover: 0 25px 80px rgba(236, 72, 153, 0.25);
      --memories-text: #831843;
      --memories-border: rgba(249, 168, 212, 0.3);
    }

    .memories {
      width: 100%;
      background: var(--memories-bg);
      padding: clamp(2.5rem, 5vw, 5rem) clamp(1rem, 3vw, 2rem);
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    /* Декоративні елементи для ностальгічного ефекту */
    .memories::before,
    .memories::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      opacity: 0.08;
      pointer-events: none;
    }

    .memories::before {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, var(--memories-primary) 0%, transparent 70%);
      top: -200px;
      left: -100px;
      animation: float 8s ease-in-out infinite;
    }

    .memories::after {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, var(--memories-secondary) 0%, transparent 70%);
      bottom: -150px;
      right: -50px;
      animation: float 10s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.05); }
    }

    .memories__container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .memories__header {
      text-align: center;
      margin-bottom: clamp(2rem, 4vw, 3.5rem);
    }

    .memories__title {
      font-size: clamp(1.75rem, 4vw, 2.75rem);
      font-weight: 700;
      color: var(--memories-text);
      margin: 0;
      line-height: 1.3;
      text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-style: normal;
      opacity: 0;
      animation: fadeInTitle 1s ease forwards;
    }

    @keyframes fadeInTitle {
      from { 
        opacity: 0;
        transform: translateY(-20px);
      }
      to { 
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Carousel Wrapper */
    .memories__carousel-wrapper {
      display: flex;
      align-items: center;
      gap: clamp(0.75rem, 2vw, 1.5rem);
      margin-bottom: 2rem;
      position: relative;
    }

    .memories__carousel {
      flex: 1;
      overflow: hidden;
      border-radius: 20px;
      background: var(--memories-card-bg);
      box-shadow: var(--memories-shadow);
      border: 2px solid var(--memories-border);
    }

    .memories__track {
      display: flex;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      will-change: transform;
    }

    .memories__slide {
      min-width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 3vw, 3rem);
      box-sizing: border-box;
    }

    .memories__media-wrapper {
      position: relative;
      max-width: 100%;
      max-height: 70vh;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .memories__media-wrapper:hover {
      transform: scale(1.02);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
    }

    .memories__slide img,
    .memories__slide video {
      display: block;
      max-width: 100%;
      max-height: 65vh;
      width: auto;
      height: auto;
      margin: 0 auto;
      border-radius: 12px;
      object-fit: contain;
    }

    /* Play overlay для відео */
    .memories__play-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .memories__media-wrapper:hover .memories__play-overlay {
      transform: translate(-50%, -50%) scale(1.1);
      background: rgba(255, 255, 255, 1);
    }

    .memories__play-icon {
      width: 0;
      height: 0;
      border-left: 24px solid var(--memories-primary);
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      margin-left: 6px;
    }

    /* Navigation buttons */
    .memories__nav {
      width: clamp(44px, 6vw, 56px);
      height: clamp(44px, 6vw, 56px);
      border-radius: 50%;
      background: var(--memories-card-bg);
      border: 2px solid var(--memories-border);
      color: var(--memories-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.15);
      flex-shrink: 0;
    }

    .memories__nav:hover:not(:disabled) {
      background: var(--memories-primary);
      color: white;
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(235, 15, 132, 0.3);
    }

    .memories__nav:active:not(:disabled) {
      transform: scale(0.95);
    }

    .memories__nav:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      background: rgba(255, 255, 255, 0.5);
    }

    /* Dots navigation */
    .memories__dots {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      padding: 1rem 0;
    }

    .memories__dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 0, 187, 0.641);
      border: 2px solid var(--memories-border);
      cursor: pointer;
      transition: all 0.3s ease;
      padding: 0;
    }

    .memories__dot:hover {
      background: rgba(221, 4, 130, 0.6);
      transform: scale(1.2);
    }

    .memories__dot.is-active {
      background: var(--memories-primary);
      border-color: var(--memories-primary);
      transform: scale(1.3);
      box-shadow: 0 0 0 4px rgba(234, 6, 89, 0.2)
    }

    /* Responsive для планшетів */
    @media (max-width: 900px) {
      .memories {
        padding: clamp(2rem, 4vw, 3rem) clamp(0.75rem, 2vw, 1.5rem);
      }

      .memories__slide {
        padding: clamp(1rem, 2vw, 2rem);
      }

      .memories__slide img,
      .memories__slide video {
        max-height: 55vh;
      }

      .memories__nav {
        width: 40px;
        height: 40px;
      }

      .memories__nav svg {
        width: 22px;
        height: 22px;
      }

      .memories__play-overlay {
        width: 64px;
        height: 64px;
      }

      .memories__play-icon {
        border-left: 18px solid var(--memories-primary);
        border-top: 11px solid transparent;
        border-bottom: 11px solid transparent;
      }
    }

    /* Responsive для мобільних */
    @media (max-width: 640px) {
      .memories__carousel-wrapper {
        gap: 0.5rem;
      }

      .memories__slide {
        padding: clamp(0.75rem, 1.5vw, 1.5rem);
      }

      .memories__slide img,
      .memories__slide video {
        max-height: 50vh;
      }

      .memories__nav {
        width: 36px;
        height: 36px;
      }

      .memories__nav svg {
        width: 20px;
        height: 20px;
      }

      .memories__dots {
        gap: 0.5rem;
      }

      .memories__dot {
        width: 10px;
        height: 10px;
      }

      .memories__play-overlay {
        width: 56px;
        height: 56px;
      }

      .memories__play-icon {
        border-left: 16px solid var(--memories-primary);
        border-top: 10px solid transparent;
        border-bottom: 10px solid transparent;
      }
    }

    /* Малі екрани */
    @media (max-width: 400px) {
      .memories__title {
        font-size: 1.5rem;
      }

      .memories__slide img,
      .memories__slide video {
        max-height: 45vh;
      }
    }

    /* Fullscreen modal для відео */
    .memories__modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(8px);
    }

    .memories__modal.is-open {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    .memories__modal-content {
      position: relative;
      max-width: 95vw;
      max-height: 95vh;
    }

    .memories__modal video {
      max-width: 100%;
      max-height: 95vh;
      border-radius: 8px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
    }

    .memories__modal-close {
      position: absolute;
      top: -50px;
      right: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      color: #333;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .memories__modal-close:hover {
      background: white;
      transform: rotate(90deg);
    }

    @media (prefers-reduced-motion: reduce) {
      .memories__title,
      .memories::before,
      .memories::after,
      .memories__track,
      .memories__media-wrapper,
      .memories__nav,
      .memories__dot {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>

  <script src="partials/memories.js"></script>
</section>
